name: cd

on:
    push:
        branches: [main]
jobs:
    deploy:
        name: Deploy
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Check out code
              uses: actions/checkout@v6

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: "1.27.1"

            - name: Build
              run: scripts/buildprod.sh

            - id: auth
              uses: google-github-actions/auth@v3
              with:
                  workload_identity_provider: "projects/281466992679/locations/global/workloadIdentityPools/github/providers/my-repo"
                  service_account: "cloud-run-deployer@sonorous-antler-515219-q5.iam.gserviceaccount.com"

            - name: Set up Cloud SDK
              uses: google-github-actions/setup-gcloud@v3

            - name: Build and push Docker image
              run: gcloud builds submit --tag us-central1-docker.pkg.dev/sonorous-antler-515219-q5/notely-ar-repo/notely:latest .

            - name: Deploy on Cloud run
              run: gcloud run deploy notely --image us-central1-docker.pkg.dev/sonorous-antler-515219-q5/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project sonorous-antler-515219-q5 --max-instances=4
